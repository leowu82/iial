<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Information Integrity and Assessment Lab</title>
    <link rel="stylesheet" href="/assets/css/site.css">
    <style>
        /* Projects Specific CSS */
        .project-card { border-left: 4px solid var(--primary-color); padding-left: 1.5rem; margin-bottom: 2.5rem; }
        .project-card h2 { color: var(--primary-color); margin-bottom: 0.5rem; border: none; padding: 0; }
        .sponsor { display: inline-block; background-color: #e9ecef; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.85rem; font-weight: bold; color: #495057; margin-bottom: 1rem; }
        .project-links { margin-top: 1rem; }
        .btn { display: inline-block; padding: 0.4rem 1rem; background-color: var(--primary-color); color: white; text-decoration: none; border-radius: 4px; font-size: 0.9rem; margin-right: 0.5rem; }
        .btn:hover { background-color: #002244; }
        .btn-outline { background-color: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); }
        .btn-outline:hover { background-color: var(--primary-color); color: white; }
    </style>
</head>
<body data-page="projects">
    <div data-site-header></div>

    <main>
        <h1>Current Projects</h1>

        <section>
            <div class="project-card">
                <h2>Elder Fraud System</h2>
                <span class="sponsor">Funded by: ...</span>
                <p>This project ...</p>
                <div class="project-links">
                    <a href="#" class="btn">View Website</a>
                    <a href="#" class="btn btn-outline">GitHub Repo</a>
                </div>
            </div>

        </section>
    </main>

    <footer><p>&copy; 2026 Information Integrity and Assessment Lab.</p></footer>

    <script src="/assets/js/site-header.js" defer></script>
</body>
</html>
