<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications - Information Integrity and Assessment Lab</title>
    <link rel="stylesheet" href="/assets/css/site.css">
    <style>
        /* Publications Specific CSS */
        .year-section { margin-bottom: 3rem; }
        .pub-item { margin-bottom: 1.5rem; }
        .pub-title { font-weight: bold; font-size: 1.1rem; }
        .pub-authors { color: #444; }
        .lab-member { font-weight: bold; text-decoration: underline; }
        .pub-venue { font-style: italic; color: #666; }
        .pub-links { margin-top: 0.25rem; font-size: 0.9rem; }
        .pub-links a { color: var(--primary-color); text-decoration: none; margin-right: 0.75rem; border: 1px solid #ccc; padding: 2px 8px; border-radius: 3px; background-color: #f8f9fa; }
        .pub-links a:hover { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
    </style>
</head>
<body data-page="publications">
    <div data-site-header></div>

    <main>
        <h1>Publications</h1>
        <!-- <p style="margin-bottom: 2rem;">Lab members are underlined. * indicates equal contribution.</p> -->

                <div class="pub-title">...</div>

        </section>

        <section class="year-section">

                <div class="pub-links">

                </div>
            </div>
        </section>
    </main>

    <footer><p>&copy; 2026 Information Integrity and Assessment Lab.</p></footer>

    <script src="/assets/js/site-header.js" defer></script>

</html>
