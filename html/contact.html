<!DOCTYPE html>

    <style>

                School of Information Sciences<br>
                University of Illinois Urbana-Champaign<br>
                601 E. John St.<br>
                Champaign, IL 61820</p>
                
                <p><strong>Email:</strong><br>
                <a href="#">example@example.edu</a></p>

                <p><strong>Social / Links:</strong><br>
                <a href="#">GitHub Organization</a><br>
                <a href="#">HuggingFace Hub</a></p>
            </section>
        </div>
    </main>

    <footer><p>&copy; 2026 Information Integrity and Assessment Lab.</p></footer>
    <script src="/assets/js/site-header.js" defer></script>

</html>
