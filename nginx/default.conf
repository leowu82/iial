server {
    # Listen on port 80 for IPv4 and IPv6
    listen 80;
    listen [::]:80;
    
    # Catch-all server name
    server_name iial.ischool.illinois.edu; 

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers 
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Routing Rules
    location / {
        # 1. Check if exact file exists ($uri)
        # 2. Check if a .html file exists (allows /people to load people.html)
        # 3. Check if it's a directory ($uri/)
        # 4. If none exist, return a 404 error
        try_files $uri $uri.html $uri/ =404;
    }

    # Caching Rules
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}