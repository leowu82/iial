version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: iial_web
    restart: unless-stopped  # Automatically restarts if the server reboots
    ports:
      - "80:80"
      - "443:443" # If added SSL/HTTPS certificates
    volumes:
      - ./html:/usr/share/nginx/html:ro      
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
